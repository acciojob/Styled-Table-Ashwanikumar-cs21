
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        thead {
            background-color: #2563eb;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #eaf1ff;
        }

        tbody tr:hover {
            background-color: #dbeafe;
        }
    </style>
</head>
<body>

    <h2>Student Result Sheet</h2>

    <table>
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Student Name</th>
                <th>Maths</th>
                <th>Science</th>
                <th>English</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>90</td>
                <td>85</td>
                <td>88</td>
                <td>263</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Priya</td>
                <td>95</td>
                <td>92</td>
                <td>90</td>
                <td>277</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Aman</td>
                <td>80</td>
                <td>85</td>
                <td>82</td>
                <td>247</td>
            </tr>

            <tr>
                <td>104</td>
                <td>Neha</td>
                <td>88</td>
                <td>91</td>
                <td>95</td>
                <td>274</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
